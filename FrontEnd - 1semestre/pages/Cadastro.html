```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://fonts.googleapis.com/css2?family=Inder&family=Montserrat:wght@300;400;500;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/Cadastro.css">

    <title>Hemec | Cadastro</title>

    <link
        rel="shortcut icon"
        href="../Images/favicon.ico"
        type="image/x-icon"
    >
</head>

<body>

    <header class="navbar">

        <div class="navbar-logo">

            <img
                src="../Images/logo/Group 32.png"
                alt="logo Hemec"
            >

        </div>


        <nav class="navbar-nav">

            <a href="../index.html">
                Início
            </a>

            <a href="Funcionalidades.html">
                Funcionalidades
            </a>

        </nav>


        <a
            href="login.html"
            class="btn-entrar"
        >
            Entrar no Sistema
        </a>

    </header>


    <main class="main-content">

        <div class="panel-image">

            <img
                src="../Images/WhatsApp Image 2026-04-16 at 15.56.33 1.png"
                alt="Equipamento hospitalar"
            >

        </div>


        <div class="panel-form">

            <div class="cadastro-card">

                <div class="cadastro-card-header">

                    <img
                        src="../Images/mdi_person-circle.png"
                        alt="Usuário"
                    >

                    <h2>
                        Cadastro de usuário
                    </h2>

                    <p>
                        Preencha os campos a seguir para criar sua conta
                    </p>

                </div>


                <!--
                    DEMO ESTÁTICA

                    Este formulário não cria uma conta real
                    e não envia informações para o backend.
                -->
                <form id="form-cadastro">

                    <div class="form-group">

                        <label>
                            Nome Completo
                        </label>

                        <div class="input-wrapper">

                            <img
                                src="../Images/material-symbols_person-outline.png"
                                alt=""
                            >

                            <input
                                type="text"
                                placeholder="Seu nome completo"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label>
                            E-mail
                        </label>

                        <div class="input-wrapper">

                            <img
                                src="../Images/Vector.png"
                                alt=""
                            >

                            <input
                                type="email"
                                placeholder="seu@email.com"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label>
                            Senha
                        </label>

                        <div class="input-wrapper">

                            <img
                                src="../Images/carbon_locked.png"
                                alt=""
                            >

                            <input
                                type="password"
                                placeholder="Crie uma senha"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label>
                            Confirme sua senha
                        </label>

                        <div class="input-wrapper">

                            <img
                                src="../Images/carbon_locked.png"
                                alt=""
                            >

                            <input
                                type="password"
                                placeholder="Confirme sua senha"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label>
                            Perfil
                        </label>

                        <div class="input-wrapper">

                            <img
                                src="../Images/f7_person-2.png"
                                alt=""
                            >

                            <select required>

                                <option value="">
                                    Selecione o perfil
                                </option>

                                <option value="engenheiro">
                                    Eng. Biomédico
                                </option>

                                <option value="tecnico">
                                    Técnico
                                </option>

                                <option value="gestor">
                                    Gestor
                                </option>

                            </select>

                        </div>

                    </div>


                    <div class="form-group">

                        <label>
                            Hospital
                        </label>

                        <div class="input-wrapper">

                            <img
                                src="../Images/boxicons_hospital.png"
                                alt=""
                            >

                            <input
                                type="text"
                                placeholder="Nome do hospital"
                                required
                            >

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="btn-submit"
                    >

                        <img
                            src="../Images/Vector2.png"
                            alt=""
                        >

                        Criar conta

                    </button>

                </form>


                <div class="divider">

                    <hr>

                    <span>
                        Ou
                    </span>

                    <hr>

                </div>


                <div class="form-footer">

                    <p>
                        Já possui uma conta?
                    </p>

                    <a href="login.html">
                        Entrar
                    </a>

                </div>

            </div>

        </div>

    </main>


    <!--
        DEMO ESTÁTICA

        O cadastro é apenas uma simulação.
        Nenhum dado é enviado ou armazenado.
    -->
    <script>

        const formulario =
            document.getElementById("form-cadastro");


        formulario.addEventListener("submit", function (event) {

            event.preventDefault();


            alert(
                "Conta criada com sucesso!\n\n"
            );


            window.location.href = "login.html";

        });

    </script>

</body>

</html>
